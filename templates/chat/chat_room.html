<!-- Вставить в шаблон чата и поддержки: -->

<div id="chat-log">
  {% for msg in messages %}
    <div><strong>{{ msg.sender.username }}</strong>: {{ msg.content }} <small>{{ msg.created_at|date:"d M Y H:i" }}</small></div>
  {% endfor %}
</div>

<input id="chat-message-input" type="text" autocomplete="off" placeholder="Введите сообщение" />
<button id="chat-message-submit">Отправить</button>

<script>
  {% if chat.booking %}
    const roomName = '{{ booking.id }}';
    const wsUrl = `ws://${window.location.host}/ws/chat/${roomName}/`;
  {% else %}
    const roomName = '{{ chat.id }}';
    const wsUrl = `ws://${window.location.host}/ws/support/${roomName}/`;
  {% endif %}

  const chatSocket = new WebSocket(wsUrl);

  chatSocket.onmessage = function(e) {
    const data = JSON.parse(e.data);
    const chatLog = document.getElementById('chat-log');
    const messageEl = document.createElement('div');
    messageEl.innerHTML = `<strong>${data.sender}</strong>: ${data.message} <small>${data.created_at}</small>`;
    chatLog.appendChild(messageEl);
  };

  chatSocket.onclose = function(e) {
    console.error('Chat socket closed unexpectedly');
  };

  const input = document.getElementById('chat-message-input');
  input.focus();

  input.addEventListener('keyup', function(e) {
    if (e.key === 'Enter') {
      sendMessage();
    }
  });

  document.getElementById('chat-message-submit').onclick = sendMessage;

  function sendMessage() {
    const message = input.value.trim();
    if (!message) return;
    chatSocket.send(JSON.stringify({'message': message}));
    input.value = '';
  }
</script>
