{% extends "base.html" %}

{% block title %}
  {{ action }} пост – Блог
{% endblock %}

{% block meta %}
  <meta name="robots" content="noindex, nofollow">
{% endblock %}

{% block content %}
  <h1>{{ action }} пост</h1>
  <form method="post"  enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.media }}
    {{ form.as_p }}
    <button type="submit">{{ action }}</button>
  </form>
  <a href="{% url 'blog_index' %}">Назад к блогу</a>
{% endblock %}
