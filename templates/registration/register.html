{% extends 'base.html' %}

{% block content %}
  <h2>Регистрация</h2>

  {% if messages %}
    <ul class="messages">
      {% for message in messages %}
        <li class="{% if message.tags %}{{ message.tags }}{% endif %}">{{ message }}</li>
      {% endfor %}
    </ul>
  {% endif %}

  <form method="POST">
    {% csrf_token %}

    <div>
      <label for="id_email">Электронная почта</label>
      <input type="email" name="email" id="id_email" required value="{{ request.POST.email|default:'' }}">
    </div>

    <div>
      <label for="id_phone">Телефон</label>
      <input type="text" name="phone" id="id_phone" required value="{{ request.POST.phone|default:'' }}">
    </div>

    <div>
      <label for="id_password">Пароль</label>
      <input type="password" name="password" id="id_password" required>
    </div>

    <div>
      <label for="id_password2">Повторите пароль</label>
      <input type="password" name="password2" id="id_password2" required>
    </div>

    <div>
      <button type="submit">Зарегистрироваться</button>
    </div>
  </form>

  <p>Уже есть аккаунт? <a href="{% url 'login' %}">Войти</a></p>

{% endblock %}
