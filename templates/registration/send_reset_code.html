<h2>Сброс пароля</h2>
<form method="post">
  {% csrf_token %}
  <label>Email:</label>
  <input type="email" name="email" required>
  <button type="submit">Отправить код</button>

  {% if messages %}
    {% for message in messages %}
      <p style="color: red;">{{ message }}</p>
    {% endfor %}
  {% endif %}

</form>
