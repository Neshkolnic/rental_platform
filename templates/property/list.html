<!-- Карта -->
<div id="map" style="width: 100%; height: 500px; margin-top: 30px;"></div>

<script src="https://api-maps.yandex.ru/2.1/?apikey=your-api-key&lang=ru_RU"></script>
<script>
    ymaps.ready(function() {
        console.log("Яндекс.Карты скрипт загружен");

        const map = new ymaps.Map('map', {
            center: [53.9, 27.5667],  // Центр карты на Минск
            zoom: 10
        });

        // Мапа для группировки маркеров
        const markersMap = {};

        // Проходим по всем объявлениям
        {% for property in properties %}
            {% if property.latitude and property.longitude %}
                try {
                    const lat = {{ property.latitude }};
                    const lon = {{ property.longitude }};
                    const placemark = new ymaps.Placemark([lat, lon], {
                        balloonContent: `
                            <h3>{{ property.title }}</h3>
                            <p>{{ property.short_description|truncatewords:30 }}</p>
                            <a href="{% url 'property_detail' pk=property.pk %}">Подробнее</a>
                        `
                    });

                    // Формируем уникальный ключ по координатам
                    const key = lat + '_' + lon;

                    // Если такого ключа еще нет, создаём массив для объектов
                    if (!markersMap[key]) {
                        markersMap[key] = [];
                    }

                    // Добавляем текущий объект в массив
                    markersMap[key].push({
                        title: "{{ property.title }}",
                        description: "{{ property.short_description|escapejs }}",
                        link: "{% url 'property_detail' pk=property.pk %}"
                    });

                    // Добавляем маркер на карту
                    map.geoObjects.add(placemark);
                } catch (error) {
                    console.error("Ошибка при добавлении маркера:", error);
                }
            {% else %}
                console.log("Нет координат для этого объекта");
            {% endif %}
        {% endfor %}

        // Обработчик клика по маркеру
        map.geoObjects.each(function(geoObject) {
            geoObject.events.add('click', function() {
                const coords = geoObject.geometry.getCoordinates();
                const key = coords[0] + '_' + coords[1];

                // Проверяем, если для этих координат есть несколько объектов
                if (markersMap[key]) {
                    // Формируем HTML-контент для всех объектов
                    const content = markersMap[key].map(item => {
                        return `
                            <div class="balloon-item">
                                <h4><a href="${item.link}">${item.title}</a></h4>
                                <p>${item.description}</p>
                            </div>
                        `;
                    }).join('');

                    // Открываем баллон с прокручиваемым списком объявлений
                    const balloonContent = `
                        <div style="max-height: 200px; overflow-y: auto;">
                            ${content}
                        </div>
                    `;

                    geoObject.balloon.open(coords, balloonContent);
                }
            });
        });
    });
</script>

<!-- Список объектов -->
{% for property in properties %}
    <div class="property-card" id="property-card-{{ property.pk }}">
        <!-- Ссылка на детальную страницу вокруг всей карточки -->
        <a href="{% url 'property_detail' pk=property.pk %}" class="property-card-link">
            <div class="property-image-container">
                {% if property.first_photo %}
                    <img src="{{ property.first_photo.image.url }}" alt="Фото {{ property.title }}" class="property-photo">
                {% else %}
                    <p>Нет фотографии</p>
                {% endif %}
            </div>
            <div class="property-info">
                <h3>{{ property.title }}</h3>
                <p>{{ property.short_description }}...</p>
                <p class="price">Цена за ночь: ${{ property.price_per_night }}</p>
            </div>
        </a>
    </div>
{% endfor %}
