{% extends "base.html" %}

{% block content %}
<h2>Добавить объявление</h2>
<form method="post" enctype="multipart/form-data">
    {% csrf_token %}

    <!-- Основные поля -->
    {{ form.as_p }}


    <!-- Карта -->
    <div id="map" style="width: 100%; height: 400px; margin: 20px 0;"></div>

    <button type="submit">Сохранить</button>
</form>

<!-- Подключение JavaScript для карты -->
<script src="https://api-maps.yandex.ru/2.1/?apikey=86725852-6abe-4f51-bde5-05c185b45eb3&lang=ru_RU"></script>
<script>
ymaps.ready(function() {
    const map = new ymaps.Map('map', {
        center: [55.75, 37.61],
        zoom: 10
    });

    const addressInput = document.getElementById('id_address');

    addressInput.addEventListener('change', function() {
        ymaps.geocode(this.value).then(function(res) {
            const firstGeoObject = res.geoObjects.get(0);
            if (firstGeoObject) {
                map.geoObjects.removeAll();
                map.geoObjects.add(firstGeoObject);
                map.setCenter(firstGeoObject.geometry.getCoordinates());

                // Заполняем скрытые поля координат
                document.getElementById('id_latitude').value = firstGeoObject.geometry.getCoordinates()[0];
                document.getElementById('id_longitude').value = firstGeoObject.geometry.getCoordinates()[1];
            }
        });
    });
});
</script>
{% endblock %}
