<h3>Выберите даты для бронирования:</h3>

<input type="text" id="date-range" placeholder="Выберите даты" />
<p id="total-price" style="margin-top: 10px;">Итоговая стоимость: -</p>

<form action="{% url 'booking_confirm' property.id %}" method="get">
    <input type="hidden" name="check_in" id="check_in">
    <input type="hidden" name="check_out" id="check_out">
    <button type="submit" class="btn btn-primary">Перейти к бронированию</button>
</form>

<style>
  .flatpickr-day.booked {
    background-color: #e57373 !important;
    color: white !important;
    text-decoration: line-through;
    cursor: not-allowed;
  }
</style>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

<script>
const bookedDates = {{ booked_dates|safe }};  // Занятые даты для визуала
const defaultPrice = {{ property.price_per_night }};
const propertyId = {{ property.id }};

flatpickr("#date-range", {
    mode: "range",
    inline: true,
    minDate: "today",
    dateFormat: "Y-m-d",
    disable: bookedDates,
    onDayCreate: function(dObj, dStr, fp, dayElem) {
        const date = dayElem.dateObj.toISOString().split('T')[0];
        if (bookedDates.includes(date)) {
            dayElem.classList.add("booked");
        }
    },
    onChange: function(selectedDates) {
        if (selectedDates.length === 2) {
            const checkIn = selectedDates[0].toISOString().split('T')[0];
            const checkOut = selectedDates[1].toISOString().split('T')[0];

            document.getElementById("check_in").value = checkIn;
            document.getElementById("check_out").value = checkOut;

            fetch(`/api/availability-data/?property_id=${propertyId}&start_date=${checkIn}&end_date=${checkOut}`)
                .then(response => response.json())
                .then(data => {
                    if (data.error) {
                        document.getElementById("total-price").innerText = "Ошибка: " + data.error;
                        return;
                    }

                    // data.dates - список объектов с {date, price, is_available}
                    let allAvailable = true;
                    let totalPrice = 0;

                    data.dates.forEach(day => {
                        if (!day.is_available) {
                            allAvailable = false;
                        }
                        totalPrice += day.price ?? defaultPrice;
                    });

                    if (!allAvailable) {
                        document.getElementById("total-price").innerText = "Выбранные даты недоступны для бронирования.";
                    } else {
                        document.getElementById("total-price").innerText = "Итоговая стоимость: $" + totalPrice.toFixed(2);
                    }
                })
                .catch(() => {
                    document.getElementById("total-price").innerText = "Ошибка при получении данных о доступности.";
                });

        } else {
            document.getElementById("total-price").innerText = "Итоговая стоимость: -";
            document.getElementById("check_in").value = "";
            document.getElementById("check_out").value = "";
        }
    }
});
</script>
