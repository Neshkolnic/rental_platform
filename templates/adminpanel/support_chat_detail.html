<h2>Чат поддержки #{{ chat.id }}</h2>

<textarea id="chat-log" cols="100" rows="20" readonly>
{% for msg in messages %}
{{ msg.sender }}: {{ msg.content }}
{% endfor %}
</textarea><br>

<input id="chat-message-input" type="text" size="100">
<button id="chat-message-submit">Отправить</button>

<script>
    // Важно: сюда передаём chat.id, который - число (без приставки support_)
    const roomName = "{{ chat.id }}";
    const chatSocket = new WebSocket(
        'ws://' + window.location.host + '/ws/support/' + roomName + '/'
    );

    chatSocket.onmessage = function(e) {
        const data = JSON.parse(e.data);
        document.querySelector('#chat-log').value += (data.username + ": " + data.message + '\n');
    };

    chatSocket.onclose = function(e) {
        console.error('WebSocket закрыт неожиданно');
    };

    document.querySelector('#chat-message-submit').onclick = function(e) {
        const input = document.querySelector('#chat-message-input');
        const message = input.value;
        if (message.trim() !== '') {
            chatSocket.send(JSON.stringify({
                'message': message
            }));
            input.value = '';
        }
    };
</script>
